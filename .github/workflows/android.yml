name: Android APK

on:
  push:
    branches: [main, apk-android]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'android-app/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    env:
      KS_PASS: ${{ secrets.KS_PASS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chiave di firma (creata una volta sola, poi riusata)
        id: key
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "Segreto KS_PASS assente: faccio solo un APK di prova (firma provvisoria)."
            echo "signed=no" >> "$GITHUB_OUTPUT"
          else
            echo "signed=yes" >> "$GITHUB_OUTPUT"
            if [ ! -f signing/banned.p12 ]; then
              keytool -genkeypair -keystore signing/banned.p12 -storetype PKCS12 -alias banned \
                -keyalg RSA -keysize 4096 -validity 36500 -storepass "$KS_PASS" -keypass "$KS_PASS" \
                -dname "CN=BANNED NC3000 Monitor, O=BANNED"
              echo "newkey=yes" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Salva la chiave nel repository (solo la prima volta)
        if: steps.key.outputs.newkey == 'yes'
        working-directory: .
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -f android-app/signing/banned.p12
          git commit -m "Chiave di firma dell'app Android [skip ci]"
          git push

      - name: Dipendenze
        run: npm install

      - name: Prepara la pagina
        run: node scripts/prepare.mjs ..

      - name: Compila il Bluetooth nativo e l'avvio
        run: npx esbuild src/native-entry.js --bundle --minify --format=iife --target=chrome90 --outfile=www/native.js

      - name: Progetto Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Compila (firmato)
        if: steps.key.outputs.signed == 'yes'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk ../aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" sign --ks ../signing/banned.p12 --ks-key-alias banned \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS --out ../NC3000-Monitor.apk ../aligned.apk
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs ../NC3000-Monitor.apk | head -3

      - name: Compila (prova)
        if: steps.key.outputs.signed != 'yes'
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../NC3000-Monitor-prova.apk

      - uses: actions/upload-artifact@v4
        with:
          name: NC3000-Monitor-apk
          path: |
            android-app/NC3000-Monitor.apk
            android-app/NC3000-Monitor-prova.apk
          if-no-files-found: error

      - name: Pubblica (link fisso per gli amici)
        if: steps.key.outputs.signed == 'yes' && github.ref == 'refs/heads/main'
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest android-app/NC3000-Monitor.apk \
            --title "NC3000 Monitor per Android" \
            --notes "Ultima versione dell'app Android. Installa questo file; la pagina si aggiorna da sola."
